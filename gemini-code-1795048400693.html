<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Xeque-Mate Sombrio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030407;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      image-rendering: pixelated;
    }

    /* Vinheta e Efeitos de Tela */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.88) 100%);
      transition: box-shadow 0.15s ease-out;
    }

    #danger-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(165, 14, 14, 0.65) 100%);
      transition: opacity 0.12s ease-out;
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      background: #ffffff;
      opacity: 0;
    }

    #jumpscare-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      background: radial-gradient(circle, rgba(220, 38, 38, 0.92), #050000 85%);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* HUD Minimalista */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* Contador Numérico Temporário de Orbs */
    #orb-popup {
      position: fixed;
      top: 34px;
      left: 50%;
      transform: translateX(-50%) scale(0.92);
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #7dd3fc;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.85), 0 2px 6px rgba(0, 0, 0, 0.95);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    #orb-popup.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Aviso exclusivo da contagem regressiva no modo Esconde-Esconde */
    #countdown-banner {
      position: fixed;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fca5a5;
      text-shadow: 0 0 14px rgba(239, 68, 68, 0.85);
      opacity: 0;
      transition: opacity 0.25s ease;
      text-align: center;
      pointer-events: none;
    }

    #countdown-banner.visible {
      opacity: 1;
    }

    /* Mira central sutil */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Dicas discretas no PC */
    #pc-hints {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: rgba(203, 213, 225, 0.45);
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Controles Mobile Multi-Touch */
    #mobile-controls {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      pointer-events: none;
    }

    #look-zone {
      position: fixed;
      inset: 0;
      pointer-events: auto;
      touch-action: none;
      z-index: 1;
    }

    #joystick-base {
      position: fixed;
      bottom: 28px;
      left: 28px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.45);
      border: 2px solid rgba(148, 163, 184, 0.35);
      pointer-events: auto;
      touch-action: none;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.55);
      border: 2px solid rgba(186, 230, 253, 0.8);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: translate(0px, 0px);
      pointer-events: none;
    }

    #action-buttons {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: grid;
      grid-template-columns: repeat(2, 68px);
      gap: 12px;
      pointer-events: auto;
      touch-action: none;
      z-index: 3;
    }

    .mob-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.58);
      border: 1.5px solid rgba(148, 163, 184, 0.45);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      touch-action: none;
      cursor: pointer;
    }

    .mob-btn.active {
      background: rgba(56, 189, 248, 0.45);
      border-color: #7dd3fc;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    /* Telas de Overlay (Menu, Pausa, Vitória, Game Over) */
    .overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(10, 14, 24, 0.86) 0%, rgba(2, 4, 9, 0.96) 100%);
      backdrop-filter: blur(6px);
      padding: 20px;
      pointer-events: auto;
    }

    .overlay-screen.hidden {
      display: none !important;
      pointer-events: none !important;
    }

    .panel {
      max-width: 640px;
      width: 100%;
      background: rgba(12, 17, 29, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 16px;
      padding: 28px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f8fafc;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
    }

    /* Seletor de Dispositivo */
    .device-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .device-btn {
      flex: 1;
      max-width: 190px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.7);
      color: #94a3b8;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .device-btn.selected {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }

    /* Seletor de Modos */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 580px) {
      .mode-grid {
        grid-template-columns: 1fr;
      }
    }

    .mode-btn {
      padding: 12px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.7);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn .mode-title {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 0.92rem;
      display: block;
      margin-bottom: 4px;
    }

    .mode-btn .mode-meta {
      font-size: 0.74rem;
      color: #94a3b8;
    }

    .mode-btn.selected {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .mode-btn.selected .mode-meta {
      color: #bae6fd;
    }

    #mode-desc {
      min-height: 44px;
      font-size: 0.84rem;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .primary-btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.85), rgba(3, 105, 161, 0.9));
      color: #ffffff;
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.55);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .danger-title {
      color: #f87171;
      text-shadow: 0 0 24px rgba(239, 68, 68, 0.45);
    }

    .victory-title {
      color: #7dd3fc;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="vignette"></div>
  <div id="danger-overlay"></div>
  <div id="flash-overlay"></div>
  <div id="jumpscare-flash"></div>

  <!-- HUD Minimalista -->
  <div id="hud">
    <div id="orb-popup">0 / 11</div>
    <div id="countdown-banner"></div>
    <div id="crosshair"></div>
    <div id="pc-hints">
      <span>WASD Mover</span>
      <span>SHIFT Correr</span>
      <span>ESPAÇO Pular</span>
      <span>C Agachar</span>
      <span id="hint-tool">F / Clique Lanterna</span>
    </div>
  </div>

  <!-- Controles Mobile Multi-Touch -->
  <div id="mobile-controls">
    <div id="look-zone"></div>
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
    <div id="action-buttons">
